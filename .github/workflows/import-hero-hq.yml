name: Import HQ Hero

on:
  push:
    paths:
      - ".github/workflows/import-hero-hq.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download full-quality hero
        env:
          HERO_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:941/quality:100/uri:ifs%3A%2F%2FM%2Fd707cac1-fd73-4ed5-94f5-44e65209ba28/watermark:F/width:1672?csig=AAAAAAAAAAAAAAAAAAAAAIIMOgztuQ3Y2mMjepmfPe0DIGyEca5eW41vPJMEhX5a&exp=1789931819&osig=AAAAAAAAAAAAAAAAAAAAAHYYg1MVwRAsYU11N0nrL-15hGMw9RqXuMPGSJULVm87&signer=media-rpc&x-canva-quality=thumbnail"
        run: |
          curl -fL "$HERO_URL" -o public/hero-studio.png
          python - <<'PY'
          import os, struct
          p="public/hero-studio.png"
          size=os.path.getsize(p)
          with open(p,"rb") as f:
              head=f.read(24)
          if head[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Downloaded file is not PNG")
          w,h=struct.unpack(">II",head[16:24])
          print("hero bytes:",size,"dimensions:",w,h)
          if size < 200_000 or w < 1600 or h < 900:
              raise SystemExit("Hero asset is still too small")
          PY
      - name: Point site to HQ asset
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("lib/episodes.ts")
          s=p.read_text()
          s=s.replace('export const HERO_IMAGE = "/hero-studio.webp";','export const HERO_IMAGE = "/hero-studio.png";')
          p.write_text(s)
          PY
      - name: Commit HQ hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hero-studio.png lib/episodes.ts
          git commit -m "Use full-quality hero studio image [asset-sync]"
          git push origin HEAD:main
