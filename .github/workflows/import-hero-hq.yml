name: Import HQ Hero

on:
  push:
    paths:
      - ".github/workflows/import-hero-hq.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download original hero
        env:
          HERO_URL: "https://d2ol7oe51mr4n9.cloudfront.net/user_3Ghx6eM94FIgc0dL0R4UmDe1Olz/07ef2fda-c7dc-4de1-9912-ff4f9ef7a9c1.png"
        run: |
          curl -fL "$HERO_URL" -o public/hero-studio-hq.png
          python - <<'PY'
          import os, struct
          p="public/hero-studio-hq.png"
          size=os.path.getsize(p)
          with open(p,"rb") as f:
              head=f.read(24)
          if head[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Downloaded file is not PNG")
          w,h=struct.unpack(">II",head[16:24])
          print("hero bytes:",size,"dimensions:",w,h)
          if size < 2_000_000 or w != 1672 or h != 941:
              raise SystemExit("Hero asset verification failed")
          PY
      - name: Point site to HQ asset
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("lib/episodes.ts")
          s=p.read_text()
          s=s.replace('export const HERO_IMAGE = "/hero-studio.webp";','export const HERO_IMAGE = "/hero-studio-hq.png";')
          p.write_text(s)
          PY
      - name: Commit HQ hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hero-studio-hq.png lib/episodes.ts
          git commit -m "Use original-quality hero studio image"
          git push origin HEAD:main
